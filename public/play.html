<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UNO</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #030712;
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.screen-game.active { justify-content: flex-start; }

/* Landing */
.landing-title { font-size: 72px; font-weight: 900; letter-spacing: -2px; text-align: center; }
.landing-title .r { color: #ef4444; }
.landing-title .b { color: #3b82f6; }
.landing-title .g { color: #22c55e; }
.landing-sub { color: #6b7280; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-top: 8px; text-align: center; }
.landing-buttons { width: 100%; max-width: 320px; margin-top: 40px; }
.btn { display: block; width: 100%; text-align: center; padding: 16px; font-weight: 700; font-size: 18px; border-radius: 16px; text-decoration: none; border: none; cursor: pointer; color: #fff; margin-bottom: 12px; }
.btn-create { background: linear-gradient(to right, #dc2626, #f97316); box-shadow: 0 4px 14px rgba(220,38,38,0.3); }
.btn-join { background: #1f2937; border: 1px solid #374151; }
.landing-footer { color: #374151; font-size: 12px; margin-top: 48px; text-align: center; }

/* Lobby */
.lobby-box { width: 100%; max-width: 400px; padding: 24px; }
.lobby-code { font-size: 48px; font-weight: 900; letter-spacing: 12px; text-align: center; color: #f59e0b; margin: 16px 0; }
.lobby-label { font-size: 14px; color: #9ca3af; text-align: center; }
.player-list { list-style: none; margin: 24px 0; }
.player-list li { padding: 12px 16px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; margin-bottom: 8px; display: flex; align-items: center; }
.player-list .host-badge { background: #f59e0b; color: #000; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; margin-left: 8px; }
.player-list .win-count { color: #22c55e; font-size: 12px; font-weight: 700; margin-left: auto; }
.player-list .player-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 12px; flex-shrink: 0; }
.btn-start { background: #dc2626; max-width: 320px; margin: 0 auto; }
.btn-start:disabled { opacity: 0.5; cursor: not-allowed; }
.lobby-wait { color: #6b7280; font-size: 14px; text-align: center; margin-top: 16px; }

/* Games to win selector */
.gtw-selector { text-align: center; margin: 16px 0; }
.gtw-selector label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
.gtw-options { display: flex; justify-content: center; gap: 8px; }
.gtw-btn { width: 48px; height: 48px; border-radius: 12px; border: 2px solid #374151; background: #111827; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
.gtw-btn.active { border-color: #f59e0b; background: #1c1917; color: #f59e0b; box-shadow: 0 0 12px rgba(245,158,11,0.3); }

/* Game Board */
.screen-game { padding: 0; padding-bottom: 0; display: flex; flex-direction: column; min-height: 100vh; }
.screen-game.active { display: flex; justify-content: flex-start; }
.game-middle { display: flex; flex: 1; align-items: stretch; }
.opp-slot { display: flex; align-items: center; justify-content: center; }
.opp-top { width: 100%; padding: 8px 0; }
.opp-side { width: 70px; flex-shrink: 0; padding: 4px; }
.opp { background: #111827; border: 2px solid #1f2937; border-radius: 10px; padding: 6px 12px; font-size: 13px; text-align: center; min-width: 60px; position: relative; }
.opp.active-turn { border-color: #f59e0b; box-shadow: 0 0 12px rgba(245,158,11,0.5); }
.opp .opp-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
.opp .opp-cards { color: #9ca3af; font-size: 11px; margin-top: 2px; }
.opp .turn-arrow { display: none; position: absolute; font-size: 18px; color: #f59e0b; animation: bounceArrow 0.6s ease-in-out infinite alternate; }
.opp-top .turn-arrow { bottom: -18px; left: 50%; transform: translateX(-50%); }
.opp-side .turn-arrow { font-size: 14px; }
.opp-left-slot .turn-arrow { right: -16px; top: 50%; transform: translateY(-50%); }
.opp-right-slot .turn-arrow { left: -16px; top: 50%; transform: translateY(-50%); }
.opp.active-turn .turn-arrow { display: block; }
.opp-side .opp { font-size: 11px; padding: 6px 6px; min-width: auto; }
.opp-side .opp-name { max-width: 55px; font-size: 11px; }
.opp-side .opp-cards { font-size: 10px; }
@-webkit-keyframes bounceArrow { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(4px); } }
@keyframes bounceArrow { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(4px); } }

/* Your turn arrow */
.my-turn-arrow { display: none; font-size: 80px; color: #22c55e; text-align: center; animation: bigBounceArrow 0.6s ease-in-out infinite alternate; padding: 0; line-height: 1; text-shadow: 0 0 20px rgba(34,197,94,0.6), 0 0 40px rgba(34,197,94,0.3); }
.my-turn-arrow.active { display: block; }
@-webkit-keyframes bigBounceArrow { from { transform: translateY(0); } to { transform: translateY(10px); } }
@keyframes bigBounceArrow { from { transform: translateY(0); } to { transform: translateY(10px); } }

/* Auto-draw message */
@-webkit-keyframes drawPulse { from { opacity: 0.6; } to { opacity: 1; } }
@keyframes drawPulse { from { opacity: 0.6; } to { opacity: 1; } }

/* Draw pile stacked look */
.draw-pile-wrapper { position: relative; width: 70px; height: 100px; }
.draw-pile-stack { position: absolute; width: 70px; height: 100px; border-radius: 10px; background: #1a2030; border: 3px solid #2d3748; }
.draw-pile-stack-1 { top: 4px; left: 4px; }
.draw-pile-stack-2 { top: 2px; left: 2px; }
.draw-pile { position: absolute; top: 0; left: 0; }

/* Draw pile glow when must draw */
.draw-pile-wrapper.must-draw .draw-pile { border-color: #f59e0b; box-shadow: 0 0 16px rgba(245,158,11,0.6); }
.draw-pile-wrapper:not(.must-draw) .draw-pile { opacity: 0.8; }

/* Scoreboard bar */
.scoreboard { width: 100%; display: flex; justify-content: center; gap: 12px; padding: 6px 8px; background: #0a0f1a; border-bottom: 1px solid #1f2937; font-size: 11px; color: #9ca3af; }
.scoreboard .score-item { display: flex; align-items: center; gap: 4px; }
.scoreboard .score-wins { color: #22c55e; font-weight: 700; }

/* Center area */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; position: relative; }
.direction-indicator { font-size: 20px; color: #6b7280; margin-bottom: 4px; }
.pile-area { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 8px 0; }
.top-card { width: 70px; height: 100px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; border: 3px solid rgba(255,255,255,0.2); position: relative; }
.draw-pile { width: 70px; height: 100px; border-radius: 10px; background: #1f2937; border: 3px solid #374151; display: flex; flex-direction: column; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; }
.draw-pile .deck-label { font-size: 11px; color: #9ca3af; margin-top: 4px; }
.draw-pile .deck-count { font-size: 18px; font-weight: 700; }
.color-dot { width: 20px; height: 20px; border-radius: 50%; margin: 4px auto 0; border: 2px solid rgba(255,255,255,0.3); }
.last-action { font-size: 13px; color: #9ca3af; text-align: center; margin: 4px 0; min-height: 20px; }
.must-draw-msg { font-size: 13px; color: #f59e0b; font-weight: 600; text-align: center; margin: 2px 0; }
.turn-msg { font-size: 15px; font-weight: 700; text-align: center; margin: 4px 0; min-height: 22px; }
.turn-msg.my-turn { color: #22c55e; }
.turn-msg.not-my-turn { color: #6b7280; }

/* Wild color picker */
.color-picker { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
.color-picker.active { display: flex; }
.color-picker-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
.color-picker-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 240px; }
.color-btn { width: 100px; height: 100px; border-radius: 16px; border: 3px solid rgba(255,255,255,0.3); cursor: pointer; font-size: 16px; font-weight: 700; color: #fff; }
.color-btn:active { transform: scale(0.9); }
.color-btn-red { background: #ef4444; }
.color-btn-blue { background: #3b82f6; }
.color-btn-green { background: #22c55e; }
.color-btn-yellow { background: #eab308; color: #000; }

/* UNO button */
.uno-btn { display: none; position: fixed; bottom: 200px; right: 16px; width: 70px; height: 70px; border-radius: 50%; background: #dc2626; color: #fff; font-size: 18px; font-weight: 900; border: 3px solid #fff; cursor: pointer; z-index: 50; box-shadow: 0 4px 20px rgba(220,38,38,0.5); }
.uno-btn.active { display: block; animation: unoPulse 0.8s ease-in-out infinite alternate; }
@-webkit-keyframes unoPulse { from { transform: scale(1); } to { transform: scale(1.1); } }
@keyframes unoPulse { from { transform: scale(1); } to { transform: scale(1.1); } }

/* Hand */
.hand-wrapper { width: 100%; background: #0a0f1a; border-top: 1px solid #1f2937; padding: 8px 4px 16px; }
.hand { display: flex; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 8px 4px; gap: 6px; justify-content: center; }
.hand.many-cards { justify-content: flex-start; }
.card { width: 60px; height: 90px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.15); cursor: pointer; -webkit-user-select: none; user-select: none; position: relative; transition: transform 0.15s, box-shadow 0.15s; }
.card:active { transform: scale(0.93) !important; }
.card.playable { transform: translateY(-8px); border-color: rgba(255,255,255,0.5); box-shadow: 0 4px 12px rgba(255,255,255,0.15); }
.card.not-playable { opacity: 0.45; cursor: default; }
.card .card-value { font-size: 22px; line-height: 1; }
.card .card-label { font-size: 9px; margin-top: 2px; opacity: 0.8; }
.card-red { background: #ef4444; color: #fff; }
.card-blue { background: #3b82f6; color: #fff; }
.card-green { background: #22c55e; color: #fff; }
.card-yellow { background: #eab308; color: #000; }
.card-wild { background: #1f2937; color: #fff; border-color: #6b7280; }
.wild-diamond { display: flex; flex-wrap: wrap; width: 24px; height: 24px; }
.wild-diamond span { width: 12px; height: 12px; }
.wd-r { background: #ef4444; border-radius: 2px 0 0 0; }
.wd-b { background: #3b82f6; border-radius: 0 2px 0 0; }
.wd-g { background: #22c55e; border-radius: 0 0 0 2px; }
.wd-y { background: #eab308; border-radius: 0 0 2px 0; }

/* Round Over overlay */
.game-over { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
.game-over.active { display: flex; }
.game-over-title { font-size: 48px; font-weight: 900; margin-bottom: 8px; }
.game-over-sub { font-size: 18px; color: #9ca3af; margin-bottom: 12px; }
.game-over-score { font-size: 14px; color: #d1d5db; margin-bottom: 24px; text-align: center; line-height: 1.8; }
.btn-home { background: #1f2937; display: inline-block; padding: 14px 32px; border-radius: 12px; text-decoration: none; color: #fff; font-weight: 700; font-size: 16px; border: 1px solid #374151; margin: 4px; }
.btn-next-round { background: #dc2626; display: inline-block; padding: 14px 32px; border-radius: 12px; color: #fff; font-weight: 700; font-size: 16px; border: none; cursor: pointer; margin: 4px; }

/* Fireworks / Celebration */
.fireworks { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 250; pointer-events: none; overflow: hidden; }
.fireworks.active { display: block; }
.firework { position: absolute; width: 6px; height: 6px; border-radius: 50%; animation: fireworkShoot 1s ease-out forwards; }
@-webkit-keyframes fireworkShoot { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.3) translateY(-80px); } }
@keyframes fireworkShoot { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.3) translateY(-80px); } }
.champion-title { font-size: 56px; font-weight: 900; background: linear-gradient(135deg, #f59e0b, #ef4444, #ec4899, #8b5cf6, #3b82f6, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; animation: champPulse 1s ease-in-out infinite alternate; }
@-webkit-keyframes champPulse { from { transform: scale(1); } to { transform: scale(1.05); } }
@keyframes champPulse { from { transform: scale(1); } to { transform: scale(1.05); } }

/* Error toast */
.toast { display: none; position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #dc2626; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 300; max-width: 90%; text-align: center; }
.toast.active { display: block; }

@media (min-width: 600px) {
  .card { width: 80px; height: 120px; border-radius: 10px; }
  .card .card-value { font-size: 30px; }
  .card .card-label { font-size: 11px; }
  .top-card { width: 90px; height: 130px; font-size: 28px; }
  .draw-pile { width: 90px; height: 130px; }
  .draw-pile-wrapper { width: 90px; height: 130px; }
  .draw-pile-stack { width: 90px; height: 130px; }
  .hand { gap: 8px; }
  .uno-btn { width: 80px; height: 80px; font-size: 20px; bottom: 240px; }
}
</style>
</head>
<body>

<!-- Landing Screen -->
<div id="screen-landing" class="screen active">
  <div>
    <div class="landing-title">
      <span class="r">U</span><span class="b">N</span><span class="g">O</span>
    </div>
    <div class="landing-sub">Multiplayer Card Game</div>
  </div>
  <div class="landing-buttons">
    <a href="/create" class="btn btn-create">Create Game</a>
    <a href="/join" class="btn btn-join">Join Game</a>
  </div>
  <div class="landing-footer">2-4 players &middot; Share the room code to play together</div>
</div>

<!-- Lobby Screen -->
<div id="screen-lobby" class="screen">
  <div class="lobby-box">
    <div class="lobby-label">Room Code</div>
    <div id="lobby-code" class="lobby-code"></div>
    <div class="lobby-label">Players</div>
    <ul id="lobby-players" class="player-list"></ul>
    <div id="gtw-selector" class="gtw-selector" style="display:none;">
      <label>Games to Win</label>
      <div class="gtw-options">
        <button class="gtw-btn active" onclick="setGamesToWin(1)" id="gtw-1">1</button>
        <button class="gtw-btn" onclick="setGamesToWin(2)" id="gtw-2">2</button>
        <button class="gtw-btn" onclick="setGamesToWin(3)" id="gtw-3">3</button>
        <button class="gtw-btn" onclick="setGamesToWin(4)" id="gtw-4">4</button>
      </div>
    </div>
    <button id="btn-start" class="btn btn-start" style="display:none;" onclick="startGame()">Start Game</button>
    <div id="lobby-wait" class="lobby-wait" style="display:none;">Waiting for host to start...</div>
  </div>
</div>

<!-- Game Screen -->
<div id="screen-game" class="screen screen-game">
  <div id="scoreboard" class="scoreboard" style="display:none;"></div>
  <div id="opp-top" class="opp-slot opp-top"></div>
  <div class="game-middle">
    <div id="opp-left" class="opp-slot opp-side opp-left-slot"></div>
    <div class="center">
      <div id="direction" class="direction-indicator"></div>
      <div id="turn-msg" class="turn-msg"></div>
      <div class="pile-area">
        <div id="top-card" class="top-card"></div>
        <div id="draw-pile-wrapper" class="draw-pile-wrapper">
          <div class="draw-pile-stack draw-pile-stack-1"></div>
          <div class="draw-pile-stack draw-pile-stack-2"></div>
          <div id="draw-pile" class="draw-pile" onclick="drawCard()">
            <div id="deck-count" class="deck-count"></div>
            <div class="deck-label">DRAW</div>
          </div>
        </div>
      </div>
      <div id="color-indicator"></div>
      <div id="must-draw-msg" class="must-draw-msg"></div>
      <div id="last-action" class="last-action"></div>
    </div>
    <div id="opp-right" class="opp-slot opp-side opp-right-slot"></div>
  </div>
  <div id="my-turn-arrow" class="my-turn-arrow">&darr;</div>
  <div class="hand-wrapper">
    <div id="hand" class="hand"></div>
  </div>
</div>

<!-- Wild Color Picker -->
<div id="color-picker" class="color-picker">
  <div class="color-picker-title">Choose a color</div>
  <div class="color-picker-grid">
    <button class="color-btn color-btn-red" onclick="pickColor('red')">Red</button>
    <button class="color-btn color-btn-blue" onclick="pickColor('blue')">Blue</button>
    <button class="color-btn color-btn-green" onclick="pickColor('green')">Green</button>
    <button class="color-btn color-btn-yellow" onclick="pickColor('yellow')">Yellow</button>
  </div>
</div>

<!-- UNO button -->
<!-- UNO call removed -->

<!-- Round / Match Over -->
<div id="game-over" class="game-over">
  <div id="game-over-title" class="game-over-title"></div>
  <div id="game-over-sub" class="game-over-sub"></div>
  <div id="game-over-score" class="game-over-score"></div>
  <div id="game-over-buttons"></div>
</div>

<!-- Fireworks container -->
<div id="fireworks" class="fireworks"></div>

<!-- Error toast -->
<div id="toast" class="toast"></div>

<script>
(function() {
  var gameCode = null;
  var playerId = null;
  var lastUpdatedAt = 0;
  var currentState = null;
  var pendingWildCardId = null;
  var pollTimer = null;
  var toastTimer = null;
  var actionInFlight = false;
  var selectedGamesToWin = 1;
  var celebrationDone = false;

  function getParams() {
    var search = window.location.search;
    var params = {};
    if (!search || search.length < 2) return params;
    var parts = search.substring(1).split("&");
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (kv.length === 2) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
    }
    return params;
  }

  var params = getParams();
  if (params.code && params.pid) {
    gameCode = params.code;
    playerId = params.pid;
    showScreen("lobby");
    startPolling();
  } else {
    showScreen("landing");
  }

  function showScreen(name) {
    var screens = document.querySelectorAll(".screen");
    for (var i = 0; i < screens.length; i++) {
      screens[i].className = screens[i].className.replace(" active", "");
    }
    var el = document.getElementById("screen-" + name);
    if (el) el.className = el.className + " active";
  }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast active";
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.className = "toast"; }, 3000);
  }

  function startPolling() { poll(); pollTimer = setInterval(poll, 800); }

  function poll() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/game/state?code=" + encodeURIComponent(gameCode) + "&playerId=" + encodeURIComponent(playerId), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (data.updatedAt !== lastUpdatedAt) {
            lastUpdatedAt = data.updatedAt;
            currentState = data;
            render(data);
          }
        } catch (e) {}
      } else if (xhr.status === 404) {
        showToast("Game not found");
        if (pollTimer) clearInterval(pollTimer);
      }
    };
    xhr.send();
  }

  function render(state) {
    if (state.status === "lobby") {
      showScreen("lobby");
      renderLobby(state);
      celebrationDone = false;
      document.getElementById("game-over").className = "game-over";
      document.getElementById("fireworks").className = "fireworks";
    } else if (state.status === "playing") {
      showScreen("game");
      renderGame(state);
      document.getElementById("game-over").className = "game-over";
    } else if (state.status === "finished") {
      showScreen("game");
      renderGame(state);
      renderGameOver(state);
    }
  }

  function renderLobby(state) {
    document.getElementById("lobby-code").textContent = state.code;
    var list = document.getElementById("lobby-players");
    var html = "";
    var wins = state.wins || {};
    for (var i = 0; i < state.players.length; i++) {
      var p = state.players[i];
      var w = wins[p.id] || 0;
      html += '<li><span class="player-dot"></span>' + escapeHtml(p.name);
      if (p.id === state.hostId) html += '<span class="host-badge">HOST</span>';
      if (w > 0) html += '<span class="win-count">' + w + ' win' + (w > 1 ? 's' : '') + '</span>';
      html += '</li>';
    }
    list.innerHTML = html;

    var btnStart = document.getElementById("btn-start");
    var lobbyWait = document.getElementById("lobby-wait");
    var gtwSelector = document.getElementById("gtw-selector");
    if (state.myId === state.hostId) {
      btnStart.style.display = "block";
      lobbyWait.style.display = "none";
      gtwSelector.style.display = "block";
      btnStart.disabled = state.players.length < 2;
    } else {
      btnStart.style.display = "none";
      gtwSelector.style.display = "none";
      lobbyWait.style.display = "block";
    }
  }

  function sortHand(cards) {
    var colorOrder = { wild: 0, red: 1, blue: 2, green: 3, yellow: 4 };
    var typeOrder = { number: 0, skip: 1, reverse: 2, draw2: 3, wild: 4, wild4: 5 };
    var sorted = cards.slice();
    sorted.sort(function(a, b) {
      var ca = colorOrder[a.color] !== undefined ? colorOrder[a.color] : 99;
      var cb = colorOrder[b.color] !== undefined ? colorOrder[b.color] : 99;
      if (ca !== cb) return ca - cb;
      // Within wild color, wild before wild4
      if (a.color === "wild" && b.color === "wild") {
        var ta = a.type === "wild" ? 0 : 1;
        var tb = b.type === "wild" ? 0 : 1;
        return ta - tb;
      }
      // Within same color: numbers first sorted ascending, then skip, reverse, draw2
      var ta = typeOrder[a.type] !== undefined ? typeOrder[a.type] : 99;
      var tb = typeOrder[b.type] !== undefined ? typeOrder[b.type] : 99;
      if (ta !== tb) return ta - tb;
      // Both numbers — sort by value
      if (a.type === "number" && b.type === "number") {
        return (a.value || 0) - (b.value || 0);
      }
      return 0;
    });
    return sorted;
  }

  // Auto-draw removed — player taps draw pile manually

  function renderGame(state) {
    // Scoreboard (if gamesToWin > 1)
    var gtw = state.gamesToWin || 1;
    var sbEl = document.getElementById("scoreboard");
    var wins = state.wins || {};
    if (gtw > 1) {
      sbEl.style.display = "flex";
      var sbHtml = "First to " + gtw + ": ";
      for (var i = 0; i < state.players.length; i++) {
        var p = state.players[i];
        var w = wins[p.id] || 0;
        sbHtml += '<span class="score-item">' + escapeHtml(p.name) + ' <span class="score-wins">' + w + '</span></span>';
        if (i < state.players.length - 1) sbHtml += " &middot; ";
      }
      sbEl.innerHTML = sbHtml;
    } else {
      sbEl.style.display = "none";
    }

    // Opponents — distribute around the table
    var myIndex = -1;
    for (var i = 0; i < state.players.length; i++) {
      if (state.players[i].id === state.myId) { myIndex = i; break; }
    }
    var opponents = [];
    var n = state.players.length;
    // Collect opponents in play order starting from the player after me
    for (var k = 1; k < n; k++) {
      var idx = (myIndex + k) % n;
      opponents.push({ player: state.players[idx], index: idx });
    }

    function makeOppHtml(opp, arrowChar) {
      var isActive = (opp.index === state.currentPlayerIndex);
      var html = '<div class="opp' + (isActive ? ' active-turn' : '') + '">';
      html += '<div class="opp-name">' + escapeHtml(opp.player.name) + '</div>';
      html += '<div class="opp-cards">' + opp.player.cardCount + ' card' + (opp.player.cardCount !== 1 ? 's' : '') + '</div>';
      html += '<div class="turn-arrow">' + arrowChar + '</div>';
      html += '</div>';
      return html;
    }

    var topEl = document.getElementById("opp-top");
    var leftEl = document.getElementById("opp-left");
    var rightEl = document.getElementById("opp-right");
    topEl.innerHTML = "";
    leftEl.innerHTML = "";
    rightEl.innerHTML = "";

    if (opponents.length === 1) {
      // 2 players: one across
      topEl.innerHTML = makeOppHtml(opponents[0], "\u2193");
    } else if (opponents.length === 2) {
      // 3 players: one left, one across
      leftEl.innerHTML = makeOppHtml(opponents[0], "\u2192");
      topEl.innerHTML = makeOppHtml(opponents[1], "\u2193");
    } else if (opponents.length === 3) {
      // 4 players: one left, one across, one right
      leftEl.innerHTML = makeOppHtml(opponents[0], "\u2192");
      topEl.innerHTML = makeOppHtml(opponents[1], "\u2193");
      rightEl.innerHTML = makeOppHtml(opponents[2], "\u2190");
    }

    // Direction — show flow around the table
    var dirEl = document.getElementById("direction");
    dirEl.textContent = state.direction === 1 ? "\u27F3" : "\u27F2";

    // Turn message + my turn arrow
    var turnEl = document.getElementById("turn-msg");
    var myArrow = document.getElementById("my-turn-arrow");
    var isMyTurn = (myIndex === state.currentPlayerIndex);
    if (state.status === "finished") {
      turnEl.textContent = "";
      turnEl.className = "turn-msg";
      myArrow.className = "my-turn-arrow";
    } else if (isMyTurn) {
      turnEl.textContent = "Your turn!";
      turnEl.className = "turn-msg my-turn";
      myArrow.className = "my-turn-arrow active";
    } else {
      var cp = state.players[state.currentPlayerIndex];
      turnEl.textContent = cp ? (escapeHtml(cp.name) + "'s turn") : "";
      turnEl.className = "turn-msg not-my-turn";
      myArrow.className = "my-turn-arrow";
    }

    // Top card
    var topEl = document.getElementById("top-card");
    if (state.topCard) {
      topEl.innerHTML = renderCardInner(state.topCard);
      topEl.className = "top-card card-" + state.topCard.color;
    } else {
      topEl.innerHTML = "";
      topEl.className = "top-card";
    }

    // Color indicator
    var colorEl = document.getElementById("color-indicator");
    if (state.currentColor) {
      colorEl.innerHTML = '<div class="color-dot" style="background:' + getColorHex(state.currentColor) + ';"></div>';
    } else {
      colorEl.innerHTML = "";
    }

    document.getElementById("deck-count").textContent = state.deckCount;

    // Draw pile glow when must draw
    var dpWrapper = document.getElementById("draw-pile-wrapper");
    if (state.mustDraw > 0 && isMyTurn) {
      dpWrapper.className = "draw-pile-wrapper must-draw";
    } else {
      dpWrapper.className = "draw-pile-wrapper";
    }

    var mdEl = document.getElementById("must-draw-msg");
    if (state.mustDraw > 0 && isMyTurn) {
      mdEl.textContent = "You must draw " + state.mustDraw + " card" + (state.mustDraw > 1 ? "s" : "") + "!";
    } else {
      mdEl.textContent = "";
    }

    document.getElementById("last-action").textContent = state.lastAction || "";

    // Hand (sorted)
    var handEl = document.getElementById("hand");
    var handHtml = "";
    var playableIds = {};
    if (isMyTurn && state.status === "playing") {
      var playable = getPlayableCards(state);
      for (var i = 0; i < playable.length; i++) playableIds[playable[i]] = true;
    }
    var sortedHand = sortHand(state.myHand);
    for (var i = 0; i < sortedHand.length; i++) {
      var card = sortedHand[i];
      var canPlay = playableIds[card.id] === true;
      var cls = "card card-" + card.color;
      if (isMyTurn && state.status === "playing") cls += canPlay ? " playable" : " not-playable";
      handHtml += '<div class="' + cls + '" data-card-id="' + card.id + '" onclick="window._playCard(\'' + card.id + '\')">';
      handHtml += renderCardInner(card);
      handHtml += '</div>';
    }
    handEl.innerHTML = handHtml;
    handEl.className = sortedHand.length > 6 ? "hand many-cards" : "hand";

    // Auto-draw logic
    // Draw pile highlight when player needs to draw
    var dpWrapper = document.getElementById("draw-pile-wrapper");
    if (isMyTurn && state.status === "playing") {
      var playable2 = getPlayableCards(state);
      if (state.mustDraw > 0 || playable2.length === 0) {
        dpWrapper.className = "draw-pile-wrapper must-draw";
      } else {
        dpWrapper.className = "draw-pile-wrapper";
      }
    } else {
      dpWrapper.className = "draw-pile-wrapper";
    }

    // UNO button
  }

  function renderGameOver(state) {
    var overlay = document.getElementById("game-over");
    overlay.className = "game-over active";
    var winnerName = "";
    for (var i = 0; i < state.players.length; i++) {
      if (state.players[i].id === state.winner) { winnerName = state.players[i].name; break; }
    }
    var titleEl = document.getElementById("game-over-title");
    var subEl = document.getElementById("game-over-sub");
    var scoreEl = document.getElementById("game-over-score");
    var btnsEl = document.getElementById("game-over-buttons");

    var gtw = state.gamesToWin || 1;
    var wins = state.wins || {};
    var isMatchOver = state.matchWinner !== null && state.matchWinner !== undefined;

    if (isMatchOver) {
      // MATCH WINNER — celebration!
      var champName = "";
      for (var i = 0; i < state.players.length; i++) {
        if (state.players[i].id === state.matchWinner) { champName = state.players[i].name; break; }
      }
      if (state.matchWinner === state.myId) {
        titleEl.innerHTML = '<span class="champion-title">CHAMPION!</span>';
        subEl.textContent = "You won the match!";
      } else {
        titleEl.innerHTML = '<span class="champion-title">' + escapeHtml(champName) + '</span>';
        subEl.textContent = "wins the match!";
      }
      // Score summary
      var scoreHtml = "";
      for (var i = 0; i < state.players.length; i++) {
        var p = state.players[i];
        var w = wins[p.id] || 0;
        scoreHtml += escapeHtml(p.name) + ": " + w + " win" + (w !== 1 ? "s" : "") + "<br>";
      }
      scoreEl.innerHTML = scoreHtml;
      btnsEl.innerHTML = '<a href="/" class="btn-home">Back to Home</a>';

      // Fire the celebration!
      if (!celebrationDone) {
        celebrationDone = true;
        launchFireworks();
      }
    } else {
      // Round over, more rounds to play
      if (state.winner === state.myId) {
        titleEl.textContent = "YOU WIN THIS ROUND!";
        titleEl.style.color = "#22c55e";
      } else {
        titleEl.textContent = escapeHtml(winnerName) + " wins this round!";
        titleEl.style.color = "#f59e0b";
      }

      if (gtw > 1) {
        var scoreHtml = "Score: ";
        for (var i = 0; i < state.players.length; i++) {
          var p = state.players[i];
          var w = wins[p.id] || 0;
          if (i > 0) scoreHtml += " &middot; ";
          scoreHtml += escapeHtml(p.name) + " " + w + "/" + gtw;
        }
        subEl.innerHTML = scoreHtml;
      } else {
        subEl.textContent = "Congratulations!";
      }
      scoreEl.innerHTML = "";

      if (state.myId === state.hostId && gtw > 1) {
        btnsEl.innerHTML = '<button class="btn-next-round" onclick="nextRound()">Next Round</button> <a href="/" class="btn-home">End Match</a>';
      } else if (state.myId === state.hostId) {
        btnsEl.innerHTML = '<a href="/" class="btn-home">Back to Home</a>';
      } else if (gtw > 1) {
        btnsEl.innerHTML = '<div style="color:#6b7280;font-size:14px;">Waiting for host to start next round...</div>';
      } else {
        btnsEl.innerHTML = '<a href="/" class="btn-home">Back to Home</a>';
      }
    }
  }

  function launchFireworks() {
    var container = document.getElementById("fireworks");
    container.className = "fireworks active";
    var colors = ["#ef4444", "#f59e0b", "#22c55e", "#3b82f6", "#ec4899", "#8b5cf6", "#f97316", "#14b8a6", "#fbbf24", "#a78bfa", "#fb923c", "#34d399", "#f472b6", "#60a5fa"];
    var burst = 0;
    var maxBursts = 40;
    var ww = window.innerWidth;
    var wh = window.innerHeight;

    function doBurst() {
      if (burst >= maxBursts) {
        // Keep going with a second wave
        setTimeout(function() { doSecondWave(0); }, 200);
        return;
      }
      burst++;
      // Multiple simultaneous bursts
      var simultaneous = 1 + Math.floor(Math.random() * 3);
      for (var s = 0; s < simultaneous; s++) {
        var cx = Math.random() * ww;
        var cy = Math.random() * wh * 0.7 + 30;
        var particles = 35 + Math.floor(Math.random() * 30);
        var burstColor = colors[Math.floor(Math.random() * colors.length)];
        var useRainbow = Math.random() > 0.5;
        for (var i = 0; i < particles; i++) {
          var dot = document.createElement("div");
          var angle = (Math.PI * 2 * i) / particles + (Math.random() - 0.5) * 0.3;
          var dist = 60 + Math.random() * 140;
          var dx = Math.cos(angle) * dist;
          var dy = Math.sin(angle) * dist;
          var c = useRainbow ? colors[Math.floor(Math.random() * colors.length)] : burstColor;
          var size = 3 + Math.floor(Math.random() * 7);
          dot.style.cssText = "position:absolute;left:" + cx + "px;top:" + cy + "px;width:" + size + "px;height:" + size + "px;background:" + c + ";border-radius:50%;pointer-events:none;box-shadow:0 0 " + (size + 4) + "px " + c + ";";
          container.appendChild(dot);
          animateParticle(dot, dx, dy, 1000 + Math.random() * 600);
        }
        // Add some sparkle trails
        for (var j = 0; j < 8; j++) {
          var sparkle = document.createElement("div");
          var sa = Math.random() * Math.PI * 2;
          var sd = 30 + Math.random() * 200;
          var sdx = Math.cos(sa) * sd;
          var sdy = Math.sin(sa) * sd;
          sparkle.style.cssText = "position:absolute;left:" + cx + "px;top:" + cy + "px;width:2px;height:2px;background:#fff;border-radius:50%;pointer-events:none;box-shadow:0 0 6px #fff;";
          container.appendChild(sparkle);
          animateParticle(sparkle, sdx, sdy, 600 + Math.random() * 400);
        }
      }
      setTimeout(doBurst, 150 + Math.random() * 200);
    }

    function doSecondWave(count) {
      if (count >= 20) {
        // Final grand finale — massive burst from center
        var fcx = ww / 2;
        var fcy = wh / 2;
        for (var i = 0; i < 100; i++) {
          var dot = document.createElement("div");
          var angle = Math.random() * Math.PI * 2;
          var dist = 80 + Math.random() * 250;
          var dx = Math.cos(angle) * dist;
          var dy = Math.sin(angle) * dist;
          var c = colors[Math.floor(Math.random() * colors.length)];
          var size = 4 + Math.floor(Math.random() * 8);
          dot.style.cssText = "position:absolute;left:" + fcx + "px;top:" + fcy + "px;width:" + size + "px;height:" + size + "px;background:" + c + ";border-radius:50%;pointer-events:none;box-shadow:0 0 " + (size + 6) + "px " + c + ";";
          container.appendChild(dot);
          animateParticle(dot, dx, dy, 1200 + Math.random() * 800);
        }
        setTimeout(function() { container.className = "fireworks"; container.innerHTML = ""; }, 3000);
        return;
      }
      // Scattered bursts across the screen
      var cx = Math.random() * ww;
      var cy = Math.random() * wh * 0.8;
      var particles = 25 + Math.floor(Math.random() * 20);
      for (var i = 0; i < particles; i++) {
        var dot = document.createElement("div");
        var angle = (Math.PI * 2 * i) / particles;
        var dist = 50 + Math.random() * 120;
        var dx = Math.cos(angle) * dist;
        var dy = Math.sin(angle) * dist;
        var c = colors[Math.floor(Math.random() * colors.length)];
        var size = 3 + Math.floor(Math.random() * 6);
        dot.style.cssText = "position:absolute;left:" + cx + "px;top:" + cy + "px;width:" + size + "px;height:" + size + "px;background:" + c + ";border-radius:50%;pointer-events:none;box-shadow:0 0 " + (size + 4) + "px " + c + ";";
        container.appendChild(dot);
        animateParticle(dot, dx, dy, 900 + Math.random() * 500);
      }
      setTimeout(function() { doSecondWave(count + 1); }, 100 + Math.random() * 150);
    }

    function animateParticle(el, dx, dy, duration) {
      var startX = parseFloat(el.style.left);
      var startY = parseFloat(el.style.top);
      var start = Date.now();
      var gravity = 40 + Math.random() * 40;
      function step() {
        var elapsed = Date.now() - start;
        var progress = Math.min(elapsed / duration, 1);
        var ease = 1 - Math.pow(1 - progress, 3);
        el.style.left = (startX + dx * ease) + "px";
        el.style.top = (startY + dy * ease + progress * progress * gravity) + "px";
        el.style.opacity = String(Math.max(0, 1 - progress * 1.2));
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          if (el.parentNode) el.parentNode.removeChild(el);
        }
      }
      requestAnimationFrame(step);
    }

    doBurst();
  }

  function renderCardInner(card) {
    var val = "", label = "";
    if (card.type === "number") { val = String(card.value); }
    else if (card.type === "skip") { val = "\u2298"; label = "SKIP"; }
    else if (card.type === "reverse") { val = "\u21C4"; label = "REV"; }
    else if (card.type === "draw2") { val = "+2"; label = "DRAW"; }
    else if (card.type === "wild") { return '<div class="wild-diamond"><span class="wd-r"></span><span class="wd-b"></span><span class="wd-g"></span><span class="wd-y"></span></div><div class="card-label">WILD</div>'; }
    else if (card.type === "wild4") { return '<div class="card-value">+4</div><div class="card-label">WILD</div>'; }
    var html = '<div class="card-value">' + val + '</div>';
    if (label) html += '<div class="card-label">' + label + '</div>';
    return html;
  }

  function getPlayableCards(state) {
    var result = [];
    if (state.mustDraw > 0) {
      for (var i = 0; i < state.myHand.length; i++) {
        var c = state.myHand[i];
        if (c.type === "draw2" && state.topCard && state.topCard.type === "draw2") result.push(c.id);
        else if (c.type === "wild4") result.push(c.id);
      }
      return result;
    }
    for (var i = 0; i < state.myHand.length; i++) {
      var c = state.myHand[i];
      if (c.color === "wild") { result.push(c.id); }
      else if (state.currentColor && c.color === state.currentColor) { result.push(c.id); }
      else if (state.topCard && c.type === "number" && state.topCard.type === "number" && c.value === state.topCard.value) { result.push(c.id); }
      else if (state.topCard && c.type !== "number" && c.type === state.topCard.type) { result.push(c.id); }
    }
    return result;
  }

  function getColorHex(color) {
    if (color === "red") return "#ef4444";
    if (color === "blue") return "#3b82f6";
    if (color === "green") return "#22c55e";
    if (color === "yellow") return "#eab308";
    return "#6b7280";
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function apiPost(url, body, cb) {
    if (actionInFlight) return;
    actionInFlight = true;
    var xhr = new XMLHttpRequest();
    xhr.open("POST", url, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      actionInFlight = false;
      if (xhr.status >= 200 && xhr.status < 300) {
        lastUpdatedAt = 0;
        poll();
        if (cb) cb(null, JSON.parse(xhr.responseText));
      } else {
        var errMsg = "Action failed";
        try { var errData = JSON.parse(xhr.responseText); if (errData.error) errMsg = errData.error; } catch (e) {}
        showToast(errMsg);
        if (cb) cb(errMsg);
      }
    };
    xhr.send(JSON.stringify(body));
  }

  window.setGamesToWin = function(n) {
    selectedGamesToWin = n;
    var btns = document.querySelectorAll(".gtw-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = "gtw-btn";
    }
    var active = document.getElementById("gtw-" + n);
    if (active) active.className = "gtw-btn active";
  };

  window.startGame = function() {
    apiPost("/api/game/start", { code: gameCode, playerId: playerId, gamesToWin: selectedGamesToWin });
  };

  window.nextRound = function() {
    apiPost("/api/game/next-round", { code: gameCode, playerId: playerId });
  };

  window._playCard = function(cardId) {
    if (!currentState || actionInFlight) return;
    var myIndex = -1;
    for (var i = 0; i < currentState.players.length; i++) {
      if (currentState.players[i].id === currentState.myId) { myIndex = i; break; }
    }
    if (myIndex !== currentState.currentPlayerIndex) return;
    if (currentState.status !== "playing") return;
    var card = null;
    for (var i = 0; i < currentState.myHand.length; i++) {
      if (currentState.myHand[i].id === cardId) { card = currentState.myHand[i]; break; }
    }
    if (!card) return;
    var playable = getPlayableCards(currentState);
    var isPlayable = false;
    for (var i = 0; i < playable.length; i++) { if (playable[i] === cardId) { isPlayable = true; break; } }
    if (!isPlayable) return;
    if (card.color === "wild") {
      pendingWildCardId = cardId;
      document.getElementById("color-picker").className = "color-picker active";
      return;
    }
    apiPost("/api/game/play", { code: gameCode, playerId: playerId, cardId: cardId });
  };

  window.pickColor = function(color) {
    document.getElementById("color-picker").className = "color-picker";
    if (pendingWildCardId) {
      apiPost("/api/game/play", { code: gameCode, playerId: playerId, cardId: pendingWildCardId, chosenColor: color });
      pendingWildCardId = null;
    }
  };

  window.drawCard = function() {
    if (!currentState || actionInFlight) return;
    var myIndex = -1;
    for (var i = 0; i < currentState.players.length; i++) {
      if (currentState.players[i].id === currentState.myId) { myIndex = i; break; }
    }
    if (myIndex !== currentState.currentPlayerIndex) return;
    if (currentState.status !== "playing") return;
    apiPost("/api/game/draw", { code: gameCode, playerId: playerId });
  };


})();
</script>
